name: SocialForge JavaScript check
on:
  push:
    branches: [socialforge-assessment]
  pull_request:
    paths: ['socialforge/**']
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application JavaScript
        run: node --check socialforge/dist/app.js
